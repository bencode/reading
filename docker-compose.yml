services:
  # Web frontend service
  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    ports:
      - "3010:3000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - db_init
    restart: unless-stopped
    networks:
      - reading_network

  # Database initialization service (runs once)
  db_init:
    build:
      context: packages/tasks
      dockerfile: Dockerfile
    command: ["yoyo", "apply", "--batch"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    networks:
      - reading_network

  # Tasks service for running scraper and other Python scripts
  tasks:
    build:
      context: packages/tasks
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    networks:
      - reading_network
    profiles:
      - tools

networks:
  reading_network:
    driver: bridge
