services:
  # Image optimization service
  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:latest
    ports:
      - "8080:8080"
    environment:
      - IMGPROXY_BIND=0.0.0.0:8080
      - IMGPROXY_LOCAL_FILESYSTEM_ROOT=/uploads
      - IMGPROXY_ENABLE_WEBP_DETECTION=true
      - IMGPROXY_ENFORCE_WEBP=false
      - IMGPROXY_QUALITY=85
      - IMGPROXY_MAX_ANIMATION_FRAMES=1
      - IMGPROXY_STRIP_METADATA=true
      - IMGPROXY_LOG_LEVEL=warn
    volumes:
      - ./data:/uploads:ro
    restart: unless-stopped
    networks:
      - reading_network

  # Web frontend service
  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    ports:
      - "3010:3000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - db_init
    restart: unless-stopped
    networks:
      - reading_network

  # Database initialization service (runs once)
  db_init:
    build:
      context: packages/tasks
      dockerfile: Dockerfile
    command: ["yoyo", "apply", "--batch", "-d", "sqlite:////app/data/reading.db", "migrations/"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    networks:
      - reading_network

  # Tasks service for running scraper and other Python scripts
  tasks:
    build:
      context: packages/tasks
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    networks:
      - reading_network
    profiles:
      - tools

networks:
  reading_network:
    driver: bridge
